spring.application.name=panacea-backend

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# =========================================================
# JPA
# =========================================================

spring.jpa.hibernate.ddl-auto=update

# =========================================================
# HIKARI CONNECTION POOL
# =========================================================

spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.data-source-properties.prepareThreshold=0
spring.datasource.hikari.data-source-properties.binaryTransfer=false

# IMPORTANT FOR SUPABASE
spring.datasource.hikari.auto-commit=false

# =========================================================
# JWT
# =========================================================

jwt.secret=${JWT_SECRET}

# =========================================================
# SERVER
# =========================================================

server.port=${PORT:8080}

# =========================================================
# PROFILE
# =========================================================

spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}

spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB


PANACEA_ADMIN_APPROVAL_PASSWORD=${PANACEA_ADMIN_APPROVAL_PASSWORD}

google.drive.folder-id=${GOOGLE_DRIVE_FOLDER_ID}
google.drive.client-id=${GOOGLE_DRIVE_CLIENT_ID}
google.drive.client-secret=${GOOGLE_DRIVE_CLIENT_SECRET}
google.drive.refresh-token=${GOOGLE_DRIVE_REFRESH_TOKEN}